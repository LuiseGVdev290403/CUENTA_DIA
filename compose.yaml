services:
  postgres:
    image: postgres:17
    container_name: cuentadia-db
    environment:
      POSTGRES_DB: cuentadia_api
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cuentadia_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: cuentadia-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"          # abre http://localhost:5050
    depends_on:
      postgres:
        condition: service_healthy



volumes:
  postgres_data: