<div class="flex min-h-screen bg-[#0f1117] text-slate-200">
  <aside class="flex w-56 flex-col justify-between border-r border-slate-800 bg-[#141824] p-3">
    <div>
      <h2 class="mb-6 px-3 pt-3 text-xl font-bold text-white">
        Cuenta<span class="text-emerald-300">Día</span>
      </h2>

      <nav class="flex flex-col gap-1 text-lg">
        <a routerLink="/dashboard" routerLinkActive="bg-indigo-950 text-white"
           class="rounded-xl px-3 py-2.5 text-slate-400 hover:text-white">📈 Dashboard</a>
        <a routerLink="/compras" routerLinkActive="bg-indigo-950 text-white"
           [routerLinkActiveOptions]="{ exact: true }"
           class="rounded-xl px-3 py-2.5 text-slate-400 hover:text-white">🛒 Compras</a>
        <a routerLink="/compras/nueva" routerLinkActive="bg-indigo-950 text-white"
           class="rounded-xl px-3 py-2.5 text-slate-400 hover:text-white">➕ Nueva compra</a>
        <a routerLink="/reportes" routerLinkActive="bg-indigo-950 text-white"
           class="rounded-xl px-3 py-2.5 text-slate-400 hover:text-white">📄 Reportes</a>

        <!-- Filtros con submenú -->
        <button
          type="button"
          (click)="toggleFiltros()"
          [attr.aria-expanded]="filtrosOpen()"
          class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-slate-400 hover:text-white"
        >
          <span>🏷️ Filtros</span>
          <svg
            class="h-4 w-4 transition-transform duration-200"
            [class.rotate-180]="filtrosOpen()"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
          >
            <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" />
          </svg>
        </button>

        <div
          class="grid transition-all duration-200"
          [class.grid-rows-[1fr]]="filtrosOpen()"
          [class.grid-rows-[0fr]]="!filtrosOpen()"
        >
          <div class="overflow-hidden">
            <div class="ml-5 flex flex-col gap-1 border-l border-slate-800 pl-3 text-base">
              <a routerLink="/filtros/categorias" routerLinkActive="bg-indigo-950 text-white"
                 class="rounded-lg px-3 py-2 text-slate-400 hover:text-white">Categorías</a>
              <a routerLink="/filtros/tiendas" routerLinkActive="bg-indigo-950 text-white"
                 class="rounded-lg px-3 py-2 text-slate-400 hover:text-white">Tiendas</a>
              <a routerLink="/filtros/cuentas" routerLinkActive="bg-indigo-950 text-white"
                 class="rounded-lg px-3 py-2 text-slate-400 hover:text-white">Cuentas</a>
              <a routerLink="/filtros/etiquetas" routerLinkActive="bg-indigo-950 text-white"
                 class="rounded-lg px-3 py-2 text-slate-400 hover:text-white">Etiquetas</a>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <div class="flex items-center gap-3 rounded-xl border border-slate-800 p-3">
      <div class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-500 text-sm font-bold text-white">D</div>
      <div class="text-xs">
        <p class="text-slate-200">demo</p>
        <p class="text-slate-500">Octubre 2026</p>
      </div>
    </div>

  </aside>

  <main class="flex-1 p-8">
    <router-outlet />
  </main>
</div>
