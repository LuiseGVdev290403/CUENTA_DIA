<div class="mb-6 flex justify-between p-2">
  <div>
    <h1 class="text-2xl font-bold text-white">
      Tiendas
    </h1>
    <p class="text-sm text-slate-400">
      Administra tus tiendas
    </p>
  </div>
  <div>
    <button (click)="abrir()" class="bg-[#7c5cff] hover:bg-purple-600 text-shadow-white font-bold py-2 px-4 rounded inline-flex items-center cursor-pointer ">
      Crear
    </button>
  </div>
</div>
<div class="overflow-x-auto rounded-2xl border border-slate-800 bg-[#161a23] p-5">
  <table class="w-full text-left text-sm">
    <thead>
    <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400">
      <th class="px-3 py-3">Id</th>
      <th class="px-3 py-3">Nombre</th>
      <th class="px-3 py-3">Descripción</th>
      <th class="px-3 py-3">Acciones</th>
    </tr>
    </thead>
    <tbody>
      @for (s of stores(); track s.idStore) {
        <tr class="border-b border-slate-800/60 last:border-0 hover:bg-white/5">
          <td class="px-3 py-3 text-slate-400">{{ s.idStore }}</td>
          <td class="px-3 py-3 font-medium text-white">{{ s.name }}</td>
          <td class="px-3 py-3 font-medium text-white">{{ s.description}}</td>
          <td class="px-3 py-3">
            <button type="button" class="text-slate-300 hover:text-whit hover:cursor-pointer">
              <fa-icon [icon]="faEdit"></fa-icon>
            </button>
            <button type="button" class="text-slate-300 hover:text-whit hover:cursor-pointer">
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="2" class="px-3 py-8 text-center text-slate-500">
            No hay tiendas para mostrar
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-poput-store-component [isOpen]="modalOpen()" title="Nueva tienda" (closed)="cerrar()">
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4">
    <div>
      <label for="name" class="mb-1 block text-sm text-slate-400">Nombre</label>
      <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="Bodega Alan"
      class="w-full rounded-xl border border-slate-700 bg-[#1a1e29] px-4 py-2 text-sm text-slate-200 placeholder-slate-500 outline-none focus:border-indigo-500"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p class="mt-1 text-xs text-red-400">El nombre es obligatorio</p>
      }
    </div>
    <div>
      <label for="description" class="mb-1 block text-sm text-slate-400">Descripción</label>
      <textarea
        id="description"
        rows="3"
        formControlName="description"
        placeholder="Bodega de Alan"
        class="w-full rounded-xl border border-slate-700 bg-[#1a1e29] px-4 py-2 text-sm text-slate-200 placeholder-slate-500 outline-none focus:border-indigo-500"
      ></textarea>
    </div>

    <div class="flex justify-end gap-3 border-t border-slate-800 pt-3">
      <button
        type="button"
        (click)="cerrar()"
        class="rounded-xl px-4 py-2 text-sm text-slate-400 hover:text-white"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="saving()"
        class="rounded-xl bg-indigo-500 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-600 disabled:opacity-50"
      >
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-poput-store-component>
